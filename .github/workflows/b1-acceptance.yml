name: B1 controlled CI acceptance

on:
  pull_request:
    paths:
      - '.github/workflows/b1-acceptance.yml'
      - 'acceptance/**'

permissions:
  contents: read

jobs:
  fixture-tests:
    name: B1 fixture tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out acceptance fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify CI state aggregation
        run: node --test --test-reporter=spec acceptance/fixture/ci-state.test.mjs
