<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR 看板</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body class="pr-dashboard-page">
  <main class="dashboard" aria-label="我的 PR 看板">
    <header class="dashboard-header">
      <div class="dashboard-context">
        <div class="account-row"><span id="viewer">正在连接 GitHub…</span></div>
        <time id="updated-at"></time>
      </div>
      <div class="dashboard-controls">
        <div class="tabs" role="tablist" aria-label="PR 列表">
          <button id="tab-authored" type="button" role="tab" aria-selected="true" aria-controls="pr-list" data-kind="authored">我创建的<span id="count-authored" class="tab-count">—</span></button>
          <button id="tab-review" type="button" role="tab" aria-selected="false" aria-controls="pr-list" data-kind="review" tabindex="-1">待我评审<span id="count-review" class="tab-count">—</span></button>
        </div>
        <button id="refresh" class="icon-button" type="button" title="刷新当前列表" aria-label="刷新当前列表"></button>
      </div>
    </header>
    <p id="list-summary" class="sr-only" aria-live="polite">读取列表…</p>
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="error" class="error-message" role="alert" hidden></p>
    <section id="pr-list" class="pr-list" role="tabpanel" aria-labelledby="tab-authored" aria-busy="true"></section>
    <button id="load-more" class="secondary-button load-more" type="button" hidden>加载更多</button>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
