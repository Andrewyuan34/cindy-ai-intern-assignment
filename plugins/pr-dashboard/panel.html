<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR 看板</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header">
      <div class="heading-row">
        <div class="heading-content"><h1>拉取请求</h1><div class="account-row"><span class="account-dot" aria-hidden="true"></span><span id="viewer">正在连接 GitHub…</span></div></div>
        <button id="refresh" class="icon-button" type="button" title="刷新当前列表" aria-label="刷新当前列表">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 7a6.5 6.5 0 1 0 .4 5M16 3v4h-4"/></svg>
        </button>
      </div>
      <div class="tabs" role="tablist" aria-label="PR 列表">
        <button id="tab-authored" type="button" role="tab" aria-selected="true" aria-controls="pr-list" data-kind="authored">我创建的<span id="count-authored" class="tab-count">—</span></button>
        <button id="tab-review" type="button" role="tab" aria-selected="false" aria-controls="pr-list" data-kind="review" tabindex="-1">待我评审<span id="count-review" class="tab-count">—</span></button>
      </div>
    </header>
    <section class="list-toolbar" aria-live="polite"><span id="list-summary">读取列表…</span><time id="updated-at"></time></section>
    <p id="notice" class="notice" role="status" hidden></p>
    <p id="error" class="error-message" role="alert" hidden></p>
    <section id="pr-list" class="pr-list" role="tabpanel" aria-labelledby="tab-authored" aria-busy="true"></section>
    <button id="load-more" class="secondary-button load-more" type="button" hidden>加载更多</button>
    <p class="refresh-note">打开面板、返回前台时更新，也可手动刷新。</p>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
