<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我的 PR · 本地演示</title>
<style>
body{margin:0;background:#eef0f2;font:14px system-ui;color:#20242b}header{padding:18px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:12px;border-bottom:1px solid #d9dde2}header strong{margin-right:auto}button,a,select{font:inherit}button,select{padding:6px 9px}label{display:flex;align-items:center;gap:6px}.controls{padding:14px 24px 0;display:flex;flex-wrap:wrap;gap:14px;align-items:center}.hint{margin:12px 24px 0;line-height:1.6;max-width:1000px}main{display:grid;grid-template-columns:minmax(0,540px) minmax(0,440px);gap:24px;padding:24px;justify-content:center}section{min-width:0}iframe{width:100%;height:760px;border:1px solid #d9dde2;border-radius:14px;background:white;box-sizing:border-box}#panel{width:min(100%,var(--preview-width,360px))}.label{margin:0 0 10px;color:#55606b}.demo-alert{color:#8c3c26}@media(max-width:850px){main{grid-template-columns:minmax(0,1fr);padding:16px}header,.controls{padding-left:16px;padding-right:16px}.hint{margin-left:16px;margin-right:16px}}body.dark{background:#171a20;color:#e5e7eb}body.dark header{border-color:#383e47}body.dark .label{color:#a7b0bd}body.dark .demo-alert{color:#f0ae91}
</style></head><body>
<header><strong>我的 PR 看板</strong><span>演示数据 · 不连接 GitHub · 不调用模型</span><button id="theme" type="button">切换明暗</button></header>
<div class="controls">
  <label>模拟场景<select id="scenario">
    <option value="normal">正常：失败／通过／运行中／暂无检查</option>
    <option value="loading">读取中（固定停留）</option>
    <option value="partial">检查信息不完整／403</option>
    <option value="auth-error">连接错误</option>
    <option value="needs_input">诊断待输入（仅界面模拟）</option>
    <option value="handoff-error">诊断交接失败</option>
  </select></label>
  <label>面板宽度<select id="panel-width"><option value="320">320 px</option><option value="360" selected>360 px</option><option value="420">420 px</option><option value="530">530 px</option></select></label>
  <button id="reset-scene" type="button">重置当前场景</button>
</div>
<p id="scenario-help" class="hint"></p>
<p id="preview-status" class="hint demo-alert" role="status" aria-live="polite">正在准备模拟宿主…</p>
<main><section><p class="label">常驻面板预览</p><iframe id="panel" title="PR 面板"></iframe></section><section><p class="label">插件设置预览（禁用凭据保存）</p><iframe id="settings" title="插件设置"></iframe></section></main>
<div id="fixture-host" hidden></div>
<script type="module" src="/dev/theme.mjs"></script><script type="module" src="/dev/ui-state.mjs"></script>
</body></html>
